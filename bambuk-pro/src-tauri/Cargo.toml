[package]
name = "bambuk-pro"
version = "0.1.0"
description = "Bambuk Pro — графика, цвет и производительность ROB RUN"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
bambuk-core = { path = "../crates/bambuk-core" }
